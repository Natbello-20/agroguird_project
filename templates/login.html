<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroGuard | Officer Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, sans-serif;
            padding: 1rem;
            margin: 0;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: #fff;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            animation: slideUp 0.4s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .illustration-area {
            background: url('/static/images/farm_background.png');
            background-size: cover;
            background-position: center;
            height: 180px;
            position: relative;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 2rem;
        }

        .illustration-area::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to bottom, rgba(46, 204, 113, 0.2), rgba(241, 196, 15, 0.4));
        }

        .illustration-placeholder {
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            border: 2px solid rgba(255, 255, 255, 0.5);
            margin-bottom: -1rem;
        }

        .illustration-placeholder i {
            font-size: 2.5rem;
            color: rgba(255, 255, 255, 0.9);
        }

        .form-area {
            padding: 2rem 1.5rem;
        }

        .form-area h2 {
            font-size: 1.75rem;
            font-weight: 700;
            color: #1e3a5f;
            margin-bottom: 0.25rem;
        }

        .form-area .subtitle {
            color: #7a8a9a;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }

        .login-method-selector {
            margin-bottom: 1.25rem;
        }

        .login-method-option {
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 0.75rem 1rem;
            margin-bottom: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
        }

        .login-method-option:hover {
            border-color: #1e3a5f;
            background: #f0f4f8;
        }

        .login-method-option.active {
            border-color: #1e3a5f;
            background: #e8f0f8;
        }

        .login-method-option input[type="radio"] {
            margin-right: 12px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .login-method-option label {
            cursor: pointer;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            font-weight: 500;
            color: #334155;
        }

        .login-method-option i {
            font-size: 1.3rem;
            color: #1e3a5f;
        }

        .input-group-icon {
            position: relative;
            margin-bottom: 1rem;
        }

        .input-group-icon i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #9aa5b1;
            font-size: 1.1rem;
        }

        .input-group-icon input {
            width: 100%;
            padding: 0.875rem 1rem 0.875rem 2.75rem;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.2s;
            background: #f8fafc;
        }

        .input-group-icon input:focus {
            outline: none;
            border-color: #1e3a5f;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(30, 58, 95, 0.1);
        }

        .input-group-icon input::placeholder {
            color: #a0aec0;
        }

        .toggle-password {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #9aa5b1;
            cursor: pointer;
        }

        .remember-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            font-size: 0.875rem;
        }

        .remember-row label {
            color: #5a6a7a;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
        }

        .form-switch .form-check-input {
            width: 2.5rem;
            height: 1.25rem;
        }

        .btn-login {
            width: 100%;
            padding: 0.875rem;
            background: #1e3a5f;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-login:hover {
            background: #2d5a87;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(30, 58, 95, 0.3);
        }

        .info-text {
            text-align: center;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid #e2e8f0;
            font-size: 0.85rem;
            color: #7a8a9a;
        }

        .info-text i {
            color: #f59e0b;
            margin-right: 5px;
        }

        .alert {
            border-radius: 12px;
            padding: 0.75rem 1rem;
            margin-bottom: 1rem;
            font-size: 0.875rem;
        }

        @media (max-width: 480px) {
            body {
                padding: 0.5rem;
            }

            .login-card {
                border-radius: 20px;
            }

            .form-area {
                padding: 1.5rem 1.25rem;
            }

            .illustration-area {
                padding: 1.5rem;
            }
        }
    </style>
</head>

<body>
    <div class="login-card">
        <div class="illustration-area">
            <div class="illustration-placeholder">
                <i class="bi bi-person-badge"></i>
            </div>
        </div>

        <div class="form-area">
            <h2>Officer Login</h2>
            <p class="subtitle">Agricultural Extension Officer Portal</p>

            {% if error %}
            <div class="alert alert-danger">
                <i class="bi bi-exclamation-circle me-2"></i>{{ error }}
            </div>
            {% endif %}

            <form action="/login" method="POST" id="loginForm">
                <!-- Login Method Selection -->
                <div class="login-method-selector">
                    <div class="login-method-option active" onclick="selectLoginMethod('ghana_card')">
                        <input type="radio" name="login_method" id="method_ghana_card" value="ghana_card" checked>
                        <label for="method_ghana_card">
                            <i class="bi bi-credit-card-2-front"></i>
                            <span>Ghana Card ID</span>
                        </label>
                    </div>

                    <div class="login-method-option" onclick="selectLoginMethod('staff_id')">
                        <input type="radio" name="login_method" id="method_staff_id" value="staff_id">
                        <label for="method_staff_id">
                            <i class="bi bi-person-badge"></i>
                            <span>Staff ID</span>
                        </label>
                    </div>
                </div>

                <!-- Ghana Card Input (shown by default) -->
                <div class="input-group-icon" id="ghana_card_input">
                    <i class="bi bi-credit-card"></i>
                    <input type="text" name="ghana_card" id="ghana_card" placeholder="GHA-XXXXXXXXX-X">
                </div>

                <!-- Staff ID Input (hidden by default) -->
                <div class="input-group-icon" id="staff_id_input" style="display: none;">
                    <i class="bi bi-person-badge"></i>
                    <input type="text" name="staff_id" id="staff_id" placeholder="AEO-XXXX">
                </div>

                <!-- Password Input -->
                <div class="input-group-icon">
                    <i class="bi bi-lock"></i>
                    <input type="password" name="password" id="password" placeholder="••••••••" required>
                    <button type="button" class="toggle-password" onclick="togglePassword()">
                        <i class="bi bi-eye" id="toggleIcon"></i>
                    </button>
                </div>

                <div class="remember-row">
                    <label class="form-check form-switch mb-0">
                        <input class="form-check-input" type="checkbox" name="remember">
                        <span>Remember me</span>
                    </label>
                </div>

                <button type="submit" class="btn-login">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                </button>
            </form>

            <p class="info-text">
                <i class="bi bi-info-circle"></i>
                Account created by Administrator
            </p>
        </div>
    </div>

    <script>
        function selectLoginMethod(method) {
            // Update active state on login method options
            document.querySelectorAll('.login-method-option').forEach(el => {
                el.classList.remove('active');
            });
            event.currentTarget.classList.add('active');

            // Update radio button
            document.getElementById(`method_${method}`).checked = true;

            // Show/hide appropriate input fields
            if (method === 'ghana_card') {
                document.getElementById('ghana_card_input').style.display = 'block';
                document.getElementById('staff_id_input').style.display = 'none';
                document.getElementById('ghana_card').required = true;
                document.getElementById('staff_id').required = false;
                document.getElementById('staff_id').value = '';
            } else if (method === 'staff_id') {
                document.getElementById('ghana_card_input').style.display = 'none';
                document.getElementById('staff_id_input').style.display = 'block';
                document.getElementById('staff_id').required = true;
                document.getElementById('ghana_card').required = false;
                document.getElementById('ghana_card').value = '';
            }
        }

        function togglePassword() {
            const pwd = document.getElementById('password');
            const icon = document.getElementById('toggleIcon');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                icon.classList.replace('bi-eye', 'bi-eye-slash');
            } else {
                pwd.type = 'password';
                icon.classList.replace('bi-eye-slash', 'bi-eye');
            }
        }

        // Form validation
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            const loginMethod = document.querySelector('input[name="login_method"]:checked').value;
            const password = document.getElementById('password').value;
            
            let identifier = '';
            if (loginMethod === 'ghana_card') {
                identifier = document.getElementById('ghana_card').value;
            } else if (loginMethod === 'staff_id') {
                identifier = document.getElementById('staff_id').value;
            }

            if (!identifier.trim()) {
                e.preventDefault();
                alert('Please enter your ' + (loginMethod === 'ghana_card' ? 'Ghana Card ID' : 'Staff ID'));
                return false;
            }

            if (!password.trim()) {
                e.preventDefault();
                alert('Please enter your password');
                return false;
            }
        });
    </script>
</body>

</html>
