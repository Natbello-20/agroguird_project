<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Complete Profile | AgroGuard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        :root {
            --primary-green: #2ecc71;
            --dark-green: #1a8f4a;
            --dark-blue: #1e3a5f;
        }

        * {
            -webkit-overflow-scrolling: touch;
        }

        html {
            overflow-x: hidden;
            overflow-y: auto;
        }

        html::-webkit-scrollbar,
        body::-webkit-scrollbar {
            display: none;
        }

        html,
        body {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        body {
            background: linear-gradient(135deg, #f8f9fa 0%, #e3f2fd 100%);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            padding: 2rem 1rem;
            overflow-x: hidden;
        }

        .profile-container {
            max-width: 500px;
            margin: 0 auto;
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .profile-card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .profile-header {
            background: linear-gradient(135deg, var(--primary-green), var(--dark-green));
            padding: 2rem;
            text-align: center;
            color: white;
        }

        .profile-icon {
            width: 80px;
            height: 80px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .profile-icon i {
            font-size: 2.5rem;
            color: var(--primary-green);
        }

        .profile-icon.fingerprint-added i {
            color: var(--dark-green);
        }

        .profile-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0 0 0.5rem;
        }

        .profile-subtitle {
            font-size: 0.9rem;
            opacity: 0.9;
            margin: 0;
        }

        .profile-body {
            padding: 2rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #555;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .form-label i {
            color: var(--primary-green);
        }

        .form-control {
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 0.875rem 1rem;
            font-size: 0.95rem;
            transition: all 0.3s;
        }

        .form-control:focus {
            border-color: var(--primary-green);
            box-shadow: 0 0 0 4px rgba(46, 204, 113, 0.1);
        }

        .btn-save {
            width: 100%;
            background: linear-gradient(135deg, var(--primary-green), var(--dark-green));
            border: none;
            border-radius: 12px;
            padding: 1rem;
            color: white;
            font-size: 1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.3);
            margin-top: 1.5rem;
        }

        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(46, 204, 113, 0.4);
        }

        .btn-save:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .biometric-section {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 2px dashed #e0e0e0;
        }

        .biometric-card {
            background: linear-gradient(135deg, #e8f8f0, #d4f1e3);
            border: 2px solid var(--primary-green);
            border-radius: 16px;
            padding: 1.5rem;
            text-align: center;
        }

        .biometric-card h3 {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--dark-green);
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .biometric-card p {
            font-size: 0.85rem;
            color: #555;
            margin-bottom: 1rem;
        }

        .btn-biometric {
            background: white;
            border: 2px solid var(--primary-green);
            color: var(--primary-green);
            border-radius: 12px;
            padding: 0.875rem 1.5rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s;
        }

        .btn-biometric:hover {
            background: var(--primary-green);
            color: white;
        }

        .btn-biometric i {
            font-size: 1.3rem;
        }

        .btn-skip {
            background: transparent;
            border: none;
            color: #999;
            padding: 0.875rem;
            font-size: 0.9rem;
            display: block;
            width: 100%;
            margin-top: 0.75rem;
            text-decoration: underline;
        }

        .btn-skip:hover {
            color: #666;
        }

        .success-message {
            background: #e8f8f0;
            color: var(--dark-green);
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .progress-steps {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .progress-step {
            width: 40px;
            height: 4px;
            background: #e0e0e0;
            border-radius: 2px;
            transition: all 0.3s;
        }

        .progress-step.active {
            background: var(--primary-green);
        }

        @media (max-width: 480px) {
            body {
                padding: 1rem 0.75rem;
            }

            .profile-header {
                padding: 1.5rem;
            }

            .profile-body {
                padding: 1.5rem;
            }

            .profile-icon {
                width: 70px;
                height: 70px;
            }

            .profile-icon i {
                font-size: 2rem;
            }
        }
    </style>
</head>

<body>
    <div class="profile-container">
        <div class="profile-card">
            <!-- Header -->
            <div class="profile-header">
                <div class="profile-icon" id="profileIcon">
                    <i class="bi bi-person-circle"></i>
                </div>
                <h1>Complete Profile</h1>
                <p class="profile-subtitle">
                    Please complete your profile information<br>to continue to the dashboard
                </p>
            </div>

            <!-- Body -->
            <div class="profile-body">
                <!-- Progress Steps -->
                <div class="progress-steps">
                    <div class="progress-step active" id="step1"></div>
                </div>

                <!-- Profile Information -->
                <div id="profileStep" style="display: block;">
                    <form id="profileForm">
                        <!-- Profile Picture Upload -->
                        <div class="form-group">
                            <label class="form-label" style="text-align: center; display: block;">
                                <i class="bi bi-camera"></i>
                                Profile Picture <small class="text-muted">(Optional)</small>
                            </label>
                            <div style="display: flex; flex-direction: column; align-items: center; gap: 1rem;">
                                <div id="profile-picture-preview" style="width: 120px; height: 120px; border-radius: 50%; border: 3px dashed #e0e0e0; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #f8f9fa; cursor: pointer;" onclick="document.getElementById('profilePictureInput').click()">
                                    <i class="bi bi-person-circle" style="font-size: 4rem; color: #ccc;"></i>
                                </div>
                                <input type="file" id="profilePictureInput" accept="image/*" style="display: none;" onchange="previewProfilePicture(event)">
                                <button type="button" class="btn btn-sm btn-outline-primary" onclick="document.getElementById('profilePictureInput').click()" style="border-radius: 20px; padding: 0.5rem 1.5rem; font-size: 0.85rem;">
                                    <i class="bi bi-upload"></i> Choose Photo
                                </button>
                                <small class="text-muted">Max 5MB, JPG/PNG</small>
                            </div>
                        </div>

                        <!-- Full Name -->
                        <div class="form-group">
                            <label class="form-label">
                                <i class="bi bi-person"></i>
                                Full Name
                            </label>
                            <input type="text" name="name" class="form-control" placeholder="Enter your full name"
                                required id="nameInput" value="{{ aeo.name if aeo and aeo.name else '' }}" 
                                style="text-transform: capitalize;" autocapitalize="words">
                        </div>

                        <!-- Email -->
                        <div class="form-group">
                            <label class="form-label">
                                <i class="bi bi-envelope"></i>
                                Email Address <small class="text-muted">(Optional)</small>
                            </label>
                            <input type="email" name="email" class="form-control" placeholder="your.email@example.com"
                                id="emailInput" value="{{ aeo.email if aeo and aeo.email else '' }}">
                        </div>

                        <!-- Phone -->
                        <div class="form-group">
                            <label class="form-label">
                                <i class="bi bi-telephone"></i>
                                Phone Number
                            </label>
                            <input type="tel" name="phone" class="form-control" id="phoneInput"
                                value="{{ aeo.phone if aeo and aeo.phone else '' }}" 
                                readonly
                                style="background-color: #f5f5f5; cursor: not-allowed;"
                                title="Phone number is set by Administrator and cannot be changed">
                            <small class="text-muted">Phone number is set by Administrator</small>
                        </div>

                        <!-- District -->
                        <div class="form-group">
                            <label class="form-label">
                                <i class="bi bi-geo-alt"></i>
                                Assigned District
                            </label>
                            <select name="district" class="form-control" required id="districtInput">
                                <option value="">Select District</option>
                                <optgroup label="Ashanti Region">
                                    <option value="Kumasi Metropolitan" {% if aeo and aeo.district == 'Kumasi Metropolitan' %}selected{% endif %}>Kumasi Metropolitan</option>
                                    <option value="Asokore Mampong" {% if aeo and aeo.district == 'Asokore Mampong' %}selected{% endif %}>Asokore Mampong</option>
                                    <option value="Oforikrom" {% if aeo and aeo.district == 'Oforikrom' %}selected{% endif %}>Oforikrom</option>
                                    <option value="Old Tafo" {% if aeo and aeo.district == 'Old Tafo' %}selected{% endif %}>Old Tafo</option>
                                    <option value="Suame" {% if aeo and aeo.district == 'Suame' %}selected{% endif %}>Suame</option>
                                    <option value="Ejisu" {% if aeo and aeo.district == 'Ejisu' %}selected{% endif %}>Ejisu</option>
                                    <option value="Bosomtwe" {% if aeo and aeo.district == 'Bosomtwe' %}selected{% endif %}>Bosomtwe</option>
                                    <option value="Kwabre East" {% if aeo and aeo.district == 'Kwabre East' %}selected{% endif %}>Kwabre East</option>
                                    <option value="Afigya Kwabre" {% if aeo and aeo.district == 'Afigya Kwabre' %}selected{% endif %}>Afigya Kwabre</option>
                                    <option value="Atwima Nwabiagya" {% if aeo and aeo.district == 'Atwima Nwabiagya' %}selected{% endif %}>Atwima Nwabiagya</option>
                                </optgroup>
                                <optgroup label="Greater Accra Region">
                                    <option value="Accra Metropolitan" {% if aeo and aeo.district == 'Accra Metropolitan' %}selected{% endif %}>Accra Metropolitan</option>
                                    <option value="Tema Metropolitan" {% if aeo and aeo.district == 'Tema Metropolitan' %}selected{% endif %}>Tema Metropolitan</option>
                                    <option value="Ga East" {% if aeo and aeo.district == 'Ga East' %}selected{% endif %}>Ga East</option>
                                    <option value="Ga West" {% if aeo and aeo.district == 'Ga West' %}selected{% endif %}>Ga West</option>
                                    <option value="La Nkwantanang-Madina" {% if aeo and aeo.district == 'La Nkwantanang-Madina' %}selected{% endif %}>La Nkwantanang-Madina</option>
                                </optgroup>
                                <optgroup label="Central Region">
                                    <option value="Cape Coast Metropolitan" {% if aeo and aeo.district == 'Cape Coast Metropolitan' %}selected{% endif %}>Cape Coast Metropolitan</option>
                                    <option value="Komenda Edina Eguafo Abirem" {% if aeo and aeo.district == 'Komenda Edina Eguafo Abirem' %}selected{% endif %}>Komenda Edina Eguafo Abirem</option>
                                    <option value="Mfantseman" {% if aeo and aeo.district == 'Mfantseman' %}selected{% endif %}>Mfantseman</option>
                                </optgroup>
                                <optgroup label="Western Region">
                                    <option value="Sekondi-Takoradi Metropolitan" {% if aeo and aeo.district == 'Sekondi-Takoradi Metropolitan' %}selected{% endif %}>Sekondi-Takoradi Metropolitan</option>
                                    <option value="Shama" {% if aeo and aeo.district == 'Shama' %}selected{% endif %}>Shama</option>
                                    <option value="Ahanta West" {% if aeo and aeo.district == 'Ahanta West' %}selected{% endif %}>Ahanta West</option>
                                    <option value="Tarkwa-Nsuaem" {% if aeo and aeo.district == 'Tarkwa-Nsuaem' %}selected{% endif %}>Tarkwa-Nsuaem</option>
                                </optgroup>
                                <optgroup label="Northern Region">
                                    <option value="Tamale Metropolitan" {% if aeo and aeo.district == 'Tamale Metropolitan' %}selected{% endif %}>Tamale Metropolitan</option>
                                    <option value="Sagnarigu" {% if aeo and aeo.district == 'Sagnarigu' %}selected{% endif %}>Sagnarigu</option>
                                    <option value="Tolon" {% if aeo and aeo.district == 'Tolon' %}selected{% endif %}>Tolon</option>
                                    <option value="Savelugu" {% if aeo and aeo.district == 'Savelugu' %}selected{% endif %}>Savelugu</option>
                                </optgroup>
                                <optgroup label="Eastern Region">
                                    <option value="New-Juaben South" {% if aeo and aeo.district == 'New-Juaben South' %}selected{% endif %}>New-Juaben South</option>
                                    <option value="Nsawam Adoagyiri" {% if aeo and aeo.district == 'Nsawam Adoagyiri' %}selected{% endif %}>Nsawam Adoagyiri</option>
                                    <option value="Suhum" {% if aeo and aeo.district == 'Suhum' %}selected{% endif %}>Suhum</option>
                                </optgroup>
                                <optgroup label="Volta Region">
                                    <option value="Ho Municipal" {% if aeo and aeo.district == 'Ho Municipal' %}selected{% endif %}>Ho Municipal</option>
                                    <option value="Hohoe Municipal" {% if aeo and aeo.district == 'Hohoe Municipal' %}selected{% endif %}>Hohoe Municipal</option>
                                    <option value="Keta Municipal" {% if aeo and aeo.district == 'Keta Municipal' %}selected{% endif %}>Keta Municipal</option>
                                </optgroup>
                                <optgroup label="Upper East Region">
                                    <option value="Bolgatanga Municipal" {% if aeo and aeo.district == 'Bolgatanga Municipal' %}selected{% endif %}>Bolgatanga Municipal</option>
                                    <option value="Bawku Municipal" {% if aeo and aeo.district == 'Bawku Municipal' %}selected{% endif %}>Bawku Municipal</option>
                                </optgroup>
                                <optgroup label="Upper West Region">
                                    <option value="Wa Municipal" {% if aeo and aeo.district == 'Wa Municipal' %}selected{% endif %}>Wa Municipal</option>
                                </optgroup>
                                <optgroup label="Other Regions">
                                    <option value="Other" {% if aeo and aeo.district == 'Other' %}selected{% endif %}>Other District</option>
                                </optgroup>
                            </select>
                        </div>

                        <button type="button" class="btn btn-save" onclick="saveProfile()">
                            <i class="bi bi-check-circle"></i>
                            <span id="saveBtnText">Complete Profile & Continue</span>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        let profilePictureFile = null;

        // Preview profile picture
        function previewProfilePicture(event) {
            const file = event.target.files[0];
            if (file) {
                // Validate file type
                if (!file.type.startsWith('image/')) {
                    alert('Please select an image file (JPG, PNG, etc.)');
                    return;
                }
                
                // Validate file size (5MB)
                if (file.size > 5 * 1024 * 1024) {
                    alert('Image size must be less than 5MB');
                    return;
                }
                
                profilePictureFile = file;
                
                // Show preview
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById('profile-picture-preview');
                    preview.innerHTML = `<img src="${e.target.result}" style="width: 100%; height: 100%; object-fit: cover;">`;
                };
                reader.readAsDataURL(file);
            }
        }

        // Upload profile picture
        async function uploadProfilePicture() {
            if (!profilePictureFile) {
                return null; // No picture selected, skip upload
            }
            
            try {
                const formData = new FormData();
                formData.append('file', profilePictureFile);
                
                const response = await fetch('/api/aeo/upload-picture', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if (!response.ok) {
                    throw new Error(result.detail || 'Failed to upload picture');
                }
                
                return result.picture_url;
            } catch (error) {
                console.error('Picture upload error:', error);
                throw error;
            }
        }

        // Save profile information
        async function saveProfile() {
            console.log('[saveProfile] Function called');
            
            const form = document.getElementById('profileForm');
            const btn = form.querySelector('.btn-save');
            const btnText = document.getElementById('saveBtnText');

            console.log('[saveProfile] Form:', form);
            console.log('[saveProfile] Button:', btn);

            // Validate form
            if (!form.checkValidity()) {
                console.log('[saveProfile] Form validation failed');
                form.reportValidity();
                return;
            }

            console.log('[saveProfile] Form is valid, proceeding...');

            // Get form data
            const formData = new FormData(form);
            const data = {
                name: formData.get('name'),
                email: formData.get('email') || null,  // Optional - can be null
                phone: document.getElementById('phoneInput').value,  // Pre-filled, read-only
                district: formData.get('district')
            };

            console.log('[saveProfile] Data to send:', data);

            // Show loading state
            btn.disabled = true;
            btnText.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Saving...';

            try {
                console.log('[saveProfile] Uploading profile picture if selected...');
                
                // Upload profile picture first if selected
                if (profilePictureFile) {
                    try {
                        await uploadProfilePicture();
                        console.log('[saveProfile] Profile picture uploaded successfully');
                    } catch (error) {
                        console.error('[saveProfile] Picture upload failed:', error);
                        alert('Warning: Failed to upload profile picture, but we\'ll continue saving your profile.');
                    }
                }
                
                console.log('[saveProfile] Sending request to /api/aeo/complete-profile');
                
                // Send to backend
                const response = await fetch('/api/aeo/complete-profile', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                console.log('[saveProfile] Response status:', response.status);
                
                const responseData = await response.json();
                console.log('[saveProfile] Response data:', responseData);

                if (!response.ok) {
                    throw new Error(responseData.detail || 'Failed to save profile');
                }

                console.log('[saveProfile] Profile saved successfully!');

                // Show success message and redirect to dashboard
                alert('✅ Profile completed successfully!\n\nRedirecting to dashboard...');
                
                setTimeout(() => {
                    window.location.href = '/dashboard';
                }, 1000);

            } catch (error) {
                console.error('[saveProfile] Error:', error);
                alert('Failed to save profile: ' + error.message + '\n\nPlease check the console for more details.');
                btn.disabled = false;
                btnText.innerHTML = 'Complete Profile & Continue';
            }
        }

        // Prevent back navigation
        history.pushState(null, null, location.href);
        window.onpopstate = function () {
            history.go(1);
        };
    </script>
</body>

</html>
