<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroGuard | Officer Signup</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1e3a5f 0%, #2d5a87 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            padding: 1rem;
            margin: 0;
        }

        .signup-card {
            width: 100%;
            max-width: 400px;
            border: none;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
            overflow: hidden;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .signup-header {
            background: #1e3a5f;
            color: white;
            padding: 2rem 1.5rem;
            text-align: center;
        }

        .form-control {
            padding: 0.75rem 1rem;
            font-size: 1rem;
            border-radius: 8px;
        }

        .form-control:focus {
            border-color: #1e3a5f;
            box-shadow: 0 0 0 3px rgba(30, 58, 95, 0.2);
        }

        .btn-success {
            background: #28a745;
            border: none;
            padding: 0.875rem;
            font-size: 1rem;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .btn-success:hover {
            background: #218838;
            transform: translateY(-1px);
        }

        @media (max-width: 480px) {
            body {
                padding: 0.5rem;
                align-items: flex-start;
                padding-top: 2rem;
            }

            .signup-card {
                border-radius: 12px;
            }

            .signup-header {
                padding: 1.5rem 1rem;
            }

            .card-body {
                padding: 1.25rem !important;
            }
        }
    </style>
</head>

<body>
    <div class="card signup-card">
        <div class="signup-header">
            <h1 class="h3 fw-bold mb-1"><i class="bi bi-flower1"></i> AgroGuard</h1>
            <p class="mb-0 text-white-50">Create Officer Account</p>
        </div>
        <div class="card-body p-4">
            {% if error %}
            <div class="alert alert-danger text-center py-2 mb-3">
                {{ error }}
            </div>
            {% endif %}

            {% if success %}
            <div class="alert alert-success text-center py-2 mb-3">
                {{ success }}
            </div>
            {% endif %}

            <form action="/signup" method="POST">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" required placeholder="Choose a username">
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required placeholder="Create password">
                </div>
                <div class="mb-4">
                    <label class="form-label">Confirm Password</label>
                    <input type="password" name="confirm_password" class="form-control" required
                        placeholder="Confirm password">
                </div>
                <button type="submit" class="btn btn-success w-100 py-2 fw-bold">Create Account</button>
            </form>

            <div class="text-center mt-3">
                <span class="text-muted">Already registered?</span>
                <a href="/login" class="text-decoration-none">Login here</a>
            </div>
        </div>
    </div>
</body>

</html>
